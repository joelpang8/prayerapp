<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PrayAlong</title>
<style>
  :root { --bg: #FAF8F5; --text: #1F1B16; --muted: #6B645C; --accent: #5B4B8A; }
  @media (prefers-color-scheme: dark) { :root { --bg: #15130F; --text: #EEE7DB; --muted: #A69D90; --accent: #B9AAE6; } }
  body { margin: 0; background: var(--bg); color: var(--text); font: 18px/1.6 Georgia, serif; }
  main { max-width: 560px; margin: 0 auto; padding: 64px 16px; text-align: center; }
  h1 { font-size: 40px; margin: 0 0 8px; }
  p { color: var(--muted); }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
<h1>PrayAlong</h1>
<p>Pray with your friends, once a day, at the same moment.</p>
<p><a href="/privacy">Privacy policy</a></p>
</main>
</body>
</html>
