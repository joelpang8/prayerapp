name: CI

on:
  push:
  pull_request:

jobs:
  rules:
    name: Security rules (Firestore + Storage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - run: npm ci
      - run: npm test

  app:
    name: App (typecheck, lint, data-layer tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            firebase/package-lock.json
            app/package-lock.json
      # firebase-tools (for the emulators) comes from the firebase package.
      - run: npm ci
        working-directory: firebase
      - run: npm ci
        working-directory: app
      - run: npm run typecheck
        working-directory: app
      - run: npx expo lint
        working-directory: app
      - run: npm test
        working-directory: app
