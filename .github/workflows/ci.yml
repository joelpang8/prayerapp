name: CI

on:
  push:
  pull_request:

jobs:
  closed-source:
    name: No license files (closed-source)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: .github/scripts/check-no-license.sh

  rules:
    name: Security rules + Cloud Functions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            firebase/package-lock.json
            firebase/functions/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: firebase/functions
      - run: npm run typecheck
        working-directory: firebase/functions
      # Builds the functions, then runs the rules + functions tests against
      # the Firestore, Storage and Functions emulators.
      - run: npm test

  app:
    name: App (typecheck, lint, data-layer tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            firebase/package-lock.json
            app/package-lock.json
      # firebase-tools (for the emulators) comes from the firebase package.
      - run: npm ci
        working-directory: firebase
      - run: npm ci
        working-directory: app
      - run: npm run typecheck
        working-directory: app
      - run: npx expo lint
        working-directory: app
      # Curated verse list: every entry valid, verse-list.json up to date.
      - run: npm run verses -- --check
        working-directory: app
      - run: npm test
        working-directory: app
